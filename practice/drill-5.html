<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drill 5</title>
</head>
<body>
    <h1>Forms</h1>
    <main>
        <section>
            <h2>Form 1</h2>
            <form name="book-visit" action="book.php" method="get">

                <div>
                    <label for="member-no">Member No.</label>
                    <input type="text" id="member-no" name="member-no" required>
                </div>
                
                <div>
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full-name" required>
                </div>
                
                <div>
                    <label for="phone-no">Phone Number</label>
                    <input type="number" id="phone-no" name="phone-no" required>
                </div>
                
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div>
                    <label for="route">Route</label>
                    <select name="route" id="route" name="route" required>
                        <option value="">-- Choose your route --</option>
                        <option value="kiserian">Kiserian</option>
                        <option value="ngong">Ngong</option>
                        <option value="isinya">Isinya</option>
                    </select>
                </div>
                <div>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </div>
            </form>
        </section>
    </main>
</body>
</html>
